# Construye las dos imágenes del Dockerfile multi-stage.
# `gcloud builds submit --tag` solo construye el último stage (sofia), así que el
# worker necesita --target explícito.
#
# Uso desde local:
#   gcloud builds submit --config cloudbuild.yaml --project sophia-ai-60e87
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_TAG=$(git rev-parse --short HEAD)
substitutions:
  _TAG: latest
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--target', 'sofia', '-t', 'gcr.io/$PROJECT_ID/sofia-backend:$_TAG', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--target', 'synthesis', '-t', 'gcr.io/$PROJECT_ID/sofia-synthesis:$_TAG', '.']
images:
  - gcr.io/$PROJECT_ID/sofia-backend:$_TAG
  - gcr.io/$PROJECT_ID/sofia-synthesis:$_TAG
